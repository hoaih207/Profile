<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon-16x16.png"
    />
    <link
      rel="android-chrome"
      sizes="192x192"
      href="img/android-chrome-192x192.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Profile</title>
  </head>

  <body>
    <canvas id="sakura"></canvas>

    <div id="notification">
      <div id="notification-content">
        <div id="loading"></div>
        <div class="ball"></div>

        <p>你好！</p>
        <p>祝你有美好的一天！</p>

        <audio id="audio" controls loop>
          <source src="./data/vấn.mp3" type="audio/mpeg" />
          Trình duyệt của bạn không hỗ trợ audio.
        </audio>

        <button id="notification-button">OK</button>
      </div>
    </div>

    <div class="app">
      <div class="card mg-10">
        <div class="card__title">
          <div class="card__title--img">
            <img src="./data/icon.png" alt="Avatar của Mai Xuân Hoài" />
          </div>

          <div class="card__title--name">
            <h1>Mai Xuân Hoài</h1>

            <div class="veri__check">
              <i class="fas fa-check"></i>
            </div>
          </div>
        </div>

        <div class="card__body mt-10">
          <div class="row">
            <div class="col col-lg-3 mt-10">
              <div class="card__item">
                <a
                  href="https://www.facebook.com/hoaih207"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="card__link"
                >
                  <div class="link__icon">
                    <i class="fab fa-facebook"></i>
                  </div>
                </a>
              </div>
            </div>

            <div class="col col-lg-3 mt-10">
              <div class="card__item">
                <a
                  href="https://www.instagram.com/hoaih207"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="card__link"
                >
                  <div class="link__icon">
                    <i class="fab fa-instagram"></i>
                  </div>
                </a>
              </div>
            </div>

            <div class="col col-lg-3 mt-10">
              <div class="card__item">
                <a
                  href="https://www.tiktok.com/@hoaihh207"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="card__link"
                >
                  <div class="link__icon">
                    <i class="fab fa-tiktok"></i>
                  </div>
                </a>
              </div>
            </div>

            <div class="col col-lg-3 mt-10">
              <div class="card__item">
                <a
                  href="https://youtube.com/@hoaihh207"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="card__link"
                >
                  <div class="link__icon">
                    <i class="fab fa-youtube" style="color: red"></i>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="toggle toggle__back">
          <a href="#" aria-label="Quay lại">
            <i class="fas fa-arrow-left"></i>
          </a>
        </div>

        <div class="toggle toggle__theme">
          <i class="fas fa-moon"></i>
        </div>

        <div class="button__list mt-10">
          <div class="row">
            <div class="col col-lg-6 mt-10">
              <a
                href="https://m.me/hoaih207"
                target="_blank"
                rel="noopener noreferrer"
              >
                <div class="button button__message">
                  <span>Nhắn Tin</span>
                </div>
              </a>
            </div>

            <div class="col col-lg-6 mt-10">
              <a
                href="https://www.facebook.com/share/1Ad6xUPfFZ/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <div class="button button__subscribe">
                  <span>Theo Dõi</span>
                </div>
              </a>
            </div>
          </div>
        </div>

        <div class="card__footer mt-10">
          <div class="footer__item">
            <span>
              <i class="fas fa-heart"></i>
              827
            </span>
          </div>

          <div class="footer__item">
            <span>
              <i class="fa fa-comment"></i>
              193
            </span>
          </div>

          <div class="footer__item">
            <span>
              <i class="fa fa-share"></i>
              615
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="btnbg"></div>

    <script src="./javascript/shader-loader.js"></script>
    <script src="./javascript/script.js"></script>
    <script src="./javascript/notification.js"></script>
  </body>
</html>
